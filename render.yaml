databases:
  - name: hackswipe-db
    plan: free
    databaseName: hackswipe
    user: hackswipe

services:
  - type: web
    plan: free
    name: hackswipe
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackswipe-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAIN
        value: rantsports.com
      - key: ADMIN_EMAILS
        value: r.dunaev@rantsports.com
      - key: NODE_ENV
        value: production
